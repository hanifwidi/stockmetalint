# PyPI release via Trusted Publishing (OIDC) — DISABLED until the maintainer approves.
#
# This workflow cannot publish anything until ALL of the following are done by the
# maintainer (see docs/release-checklist.md):
#   1. Register a PyPI Trusted Publisher: owner hanifwidi, repository stockmetalint,
#      workflow release-pypi.yml, environment "pypi".
#   2. Create a protected GitHub environment named "pypi" with required reviewers.
#   3. Set the repository variable PYPI_PUBLISHING_APPROVED to "true".
# No API token is stored anywhere; publishing uses short-lived OIDC credentials.
name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal the package version, e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    if: github.repository == 'hanifwidi/stockmetalint' && vars.PYPI_PUBLISHING_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify requested version matches the package
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          ACTUAL=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/stockmetalint/_version.py').read_text()).group(1))")
          test "$ACTUAL" = "$REQUESTED" || { echo "version mismatch: package $ACTUAL vs requested $REQUESTED"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/wheel_smoke.py dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI (requires environment approval)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/stockmetalint/
    permissions:
      id-token: write # OIDC for Trusted Publishing; the only write permission in this repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
