[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stockmetalint"
dynamic = ["version"]
description = "Offline-first stock media metadata and Adobe Stock CSV validation toolkit (unofficial, not affiliated with Adobe)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hanifwidi" }]
keywords = ["adobe-stock", "csv", "metadata", "linter", "stock-photography", "validation", "preflight"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# Zero runtime dependencies by design; see docs/architecture.md.
dependencies = []

[project.optional-dependencies]
# Optional JPEG/PNG decode and dimension checks for `lint --inspect`.
images = ["Pillow>=10.3"]
# Development and test tooling (not needed to run the CLI).
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.22",
  "Pillow>=10.3",
  "build>=1.2",
]

[project.scripts]
stockmetalint = "stockmetalint.cli:main"

[project.urls]
Homepage = "https://github.com/hanifwidi/stockmetalint"
Documentation = "https://github.com/hanifwidi/stockmetalint/tree/main/docs"
Issues = "https://github.com/hanifwidi/stockmetalint/issues"
Changelog = "https://github.com/hanifwidi/stockmetalint/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/stockmetalint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stockmetalint"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "C4", "A", "N",
  "PIE", "PT", "RET", "ISC", "TID", "PERF", "BLE", "PTH",
]
ignore = [
  "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; long user-facing strings may run to 110.
max-line-length = 110

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, subprocess, compound asserts and intentional Unicode test data are fine.
"tests/**" = ["S101", "S603", "S607", "S108", "PTH", "PERF", "PT018", "RUF001"]
"scripts/**" = ["S603", "S607", "T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["stockmetalint"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "slow: performance or subprocess-heavy tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["stockmetalint"]

[tool.coverage.paths]
source = ["src/stockmetalint", "*/site-packages/stockmetalint"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]
